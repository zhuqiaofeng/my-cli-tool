
#配置数据源
spring:
  redis:
    database: 0
    host: 127.0.0.1
    port: 6379
    #password: 123456
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    encoding: UTF-8
  # ==================== ShardingSphere 分库分表配置（5.5.1已适配snakeyaml2.x） ====================
  datasource:
    driver-class-name: org.apache.shardingsphere.driver.ShardingSphereDriver
    url: jdbc:shardingsphere:classpath:sharding.yml
  resources:
    static-locations: classpath:/templates,classpath:/static/
  # RabbitMQ 配置（默认就是 localhost:5672 guest/guest，不用写也能连）
  # rabbitmq:
  #   host: 127.0.0.1
  #   port: 5672
  #   username: guest
  #   password: guest
  #   virtual-host: /
  # MongoDB 配置
  data:
    mongodb:
      host: 127.0.0.1
      port: 27017
      database: test
    # Elasticsearch 配置
    elasticsearch:
      uris: http://127.0.0.1:9200
#设置端口号
server:
  port: 80
#mybatis配置
mybatis:
  type-aliases-package: com.hz.boot01.pojo
  mapper-locations: classpath:mappers/*.xml
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl  #打印SQL语句

# 日志配置
logging:
  level:
    # 打印 MongoDB 执行的查询语句
    org.springframework.data.mongodb.core.MongoTemplate: DEBUG




